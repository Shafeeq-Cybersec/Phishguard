name: Deploy to Azure Container Apps

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          client-secret: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          subscription-id: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          tenant-id: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ca9c23a426b2acr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ca9c23a426b2acr.azurecr.io/phishguard:${{ github.sha }}

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ca9c23a426b2acr
          containerAppName: phishguard
          resourceGroup: promptshield-rg
          imageToDeploy: ca9c23a426b2acr.azurecr.io/phishguard:${{ github.sha }}
